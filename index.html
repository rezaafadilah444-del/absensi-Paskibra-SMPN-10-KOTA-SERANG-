<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Absensi Paskibra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HALAMAN LOGIN
    ========================== -->

    <section id="loginPage" class="page active">

        <div class="login-box">

            <div class="logo">
                🇮🇩
            </div>

            <h1>ABSENSI PASKIBRA</h1>

            <p>
                Silakan login untuk masuk
            </p>

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button
                onclick="login()"
                class="btn-primary">

                🔐 Masuk Absensi

            </button>

            <p
                id="loginError"
                class="error">
            </p>

        </div>

    </section>


    <!-- =========================
         HALAMAN ABSENSI
    ========================== -->

    <section id="attendancePage"
        class="page">

        <header>

            <div>
                <h1>🇮🇩 PASKIBRA</h1>

                <p>
                    Daftar Hadir Anggota
                </p>
            </div>

            <button
                onclick="logout()"
                class="logout">

                Keluar

            </button>

        </header>


        <main>

            <!-- FORM ABSEN -->

            <div class="card">

                <h2>📝 Isi Kehadiran</h2>

                <p class="info">
                    Masukkan nama dan kelas kamu.
                </p>


                <input
                    type="text"
                    id="nama"
                    placeholder="Nama lengkap"
                >


                <select id="kelas">

                    <option value="">
                        Pilih kelas
                    </option>

                    <option>VII A</option>
                    <option>VII B</option>
                    <option>VII C</option>
                    <option>VII D</option>
                    <option>VII E</option>
                    <option>VII F</option>
                    <option>VII G</option>
                    <option>VII H</option>
                    <option>VII I</option>
                    <option>VII J</option>

                    <option>VIII A</option>
                    <option>VIII B</option>
                    <option>VIII C</option>
                    <option>VIII D</option>
                    <option>VIII E</option>
                    <option>VIII F</option>
                    <option>VIII G</option>
                    <option>VIII H</option>
                    <option>VIII I</option>
                    <option>VIII J</option>

                    <option>IX A</option>
                    <option>IX B</option>
                    <option>IX C</option>
                    <option>IX D</option>
                    <option>IX E</option>
                    <option>IX F</option>
                    <option>IX G</option>
                    <option>IX H</option>
                    <option>IX I</option>
                    <option>IX J</option>

                </select>


                <button
                    onclick="absen()"
                    class="btn-primary">

                    ✅ Absen Sekarang

                </button>

                <p
                    id="attendanceMessage"
                    class="message">
                </p>

            </div>


            <!-- DAFTAR HADIR -->

            <div class="card">

                <div class="list-header">

                    <div>
                        <h2>
                            📋 Daftar Hadir
                        </h2>

                        <p id="jumlahHadir">
                            0 anggota hadir
                        </p>
                    </div>

                    <button
                        onclick="resetAbsensi()"
                        class="reset">

                        Reset

                    </button>

                </div>


                <div
                    id="daftarHadir">

                    <div class="empty">
                        Belum ada yang absen.
                    </div>

                </div>

            </div>

        </main>

    </section>


    <script src="script.js"></script>

</body>

</html>
